# Render blueprint — one-click deploy of ClimateLens (free tier).
# The Node server serves both the API and the built web UI (single process).
services:
  - type: web
    name: climatelens
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter climatelens-server build && pnpm --filter climatelens-web build
    startCommand: pnpm --filter climatelens-server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
